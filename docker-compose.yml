# Postgres for the Лайм AI control panel. The app itself runs directly on the
# machine (`make serve` / `make dev`, or `.\make.ps1 serve` on Windows) so
# detection can use the GPU without Docker; only the database lives here.
#
#   make db-up      # start (data is kept in the `pgdata` volume)
#   make db-down    # stop (data stays)
#
# The app connects with STOREGUARD_DATABASE_URL, default
#   postgresql+psycopg://storeguard:storeguard@127.0.0.1:5432/storeguard
# Change the password/port in .env (STOREGUARD_DB_PASSWORD / STOREGUARD_DB_PORT)
# and update STOREGUARD_DATABASE_URL to match.

services:
  db:
    image: postgres:17-alpine
    container_name: storeguard-db
    environment:
      POSTGRES_USER: storeguard
      POSTGRES_PASSWORD: ${STOREGUARD_DB_PASSWORD:-storeguard}
      POSTGRES_DB: storeguard
    ports:
      # Only reachable from this computer.
      - "127.0.0.1:${STOREGUARD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeguard -d storeguard"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
