[project]
name = "storeguard"
version = "0.1.0"
description = "Real-time retail video analytics: theft-related action detection on RTSP cameras (person tracking, zone control, concealment action recognition, POS cash control)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "lap>=0.5.12",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "requests>=2.32",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.52",
    "itsdangerous>=2.2.0",
    "bcrypt>=5.0.0",
    "pydantic-settings>=2.15.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
cloud = [
    "alembic>=1.13",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[project.scripts]
storeguard = "storeguard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storeguard"]
# Vue source for the cloud cabinet and the dashboard; only their build output
# (checked into cloud/static/ and dashboard/static/) is needed at runtime.
# Not force-include: hatchling's default packages discovery already picks up
# static/ and migrations/ on its own — an explicit force-include of a path it
# already covers raises a "file already in archive" error instead of being a
# harmless no-op.
exclude = [
    "src/storeguard/cloud/frontend",
    "src/storeguard/dashboard/frontend",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
