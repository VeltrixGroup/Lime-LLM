# Alembic config for the storeguard cloud control plane.
# The database URL is NOT set here — env.py reads it from STOREGUARD_DATABASE_URL
# (via cloud settings) so dev/prod/test all use the same migrations.
[alembic]
script_location = src/storeguard/cloud/migrations
prepend_sys_path = src
path_separator = os
# Timestamped, slugged revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
