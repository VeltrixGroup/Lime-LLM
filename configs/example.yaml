detector:
  model: auto        # auto = yolo11m.pt on GPU, yolo11s.pt on CPU (or a weights path)
  conf: 0.25
  imgsz: 0           # 0 = auto: 1280 on GPU, 800 on CPU
  device: auto
# One person id across all cameras (person seen as id 1 on one camera stays
# id 1 on the others).
reid:
  enabled: true
  model: auto        # auto = ImageNet ResNet, or a TorchScript person-ReID model path
  threshold: 0.6     # raise if different people share an id, lower if one person gets several
  ttl_sec: 1800
action:
  weights: models/action.pt
  clip_len: 16
  stride: 2
  size: 112
  classes: [normal, pocket, take_cash]
  thresholds: {pocket: 0.75, take_cash: 0.80}
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
# POST JSON to your backend when unpaid-exit (or other) events fire.
notify:
  enabled: false
  url: "https://api.example.com/v1/storeguard/alerts"
  kinds: [exit_no_pay]          # empty list = all kinds
  headers: {}                   # e.g. {Authorization: "Bearer …"}
  timeout_sec: 10
events_dir: events
process_every: 1
cameras:
  - name: hall-1
    source: "rtsp://admin:PASSWORD@192.168.1.64:554/Streaming/Channels/101"
    scenarios: [pocket, exit_no_pay]
    zones_file: zones/hall-1.yaml
  - name: cashier-1
    source: "rtsp://admin:PASSWORD@192.168.1.65:554/Streaming/Channels/101"
    scenarios: [cashier]
    zones_file: zones/cashier-1.yaml
